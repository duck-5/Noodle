name: Test and Build Extension

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Moodle Client
        run: pnpm run build:moodle-client

      - name: Run Moodle Client Unit Tests
        run: pnpm test:moodle-client

      - name: Run Cross-Browser Build Parity Tests
        run: pnpm test:parity

      - name: Install Playwright Browsers & OS Dependencies
        run: pnpm --filter extension exec playwright install --with-deps chromium

      - name: Run Extension E2E Playwright Tests
        run: xvfb-run --auto-servernum -- pnpm test:e2e

      - name: Upload Playwright Test Report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          retention-days: 7

      - name: Build extension for Chrome
        run: pnpm --filter extension run build:chrome

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: apps/extension/dist

      - name: Build extension for Firefox
        run: pnpm --filter extension run build:firefox

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: apps/extension/dist
