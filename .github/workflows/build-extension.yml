name: Build and Upload Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Moodle Client
        run: pnpm --filter @tautracker/moodle-client build

      - name: Build extension for Chrome
        run: pnpm --filter extension build:chrome

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-chrome
          path: apps/extension/dist

      - name: Build extension for Firefox
        run: pnpm --filter extension build:firefox

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-firefox
          path: apps/extension/dist
